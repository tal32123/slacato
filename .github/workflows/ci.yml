name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: slacato
          POSTGRES_USER: slacato
          POSTGRES_PASSWORD: slacato
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slacato -d slacato"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://slacato:slacato@127.0.0.1:54329/slacato
      REDIS_URL: redis://127.0.0.1:56379
      WEB_ORIGIN: http://127.0.0.1:4173
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      AI_PROVIDER: mock
      LOG_LEVEL: error
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, boundaries, and types
        run: pnpm quality:ci

      - name: Prepare database
        run: pnpm db:migrate && pnpm ingest:records

      - name: Run unit, contract, and integration tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
