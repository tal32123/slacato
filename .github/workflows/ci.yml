name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: slacato
          POSTGRES_USER: slacato
          POSTGRES_PASSWORD: slacato
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slacato -d slacato"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://slacato:slacato@127.0.0.1:54329/slacato
      REDIS_URL: redis://127.0.0.1:56379
      WEB_ORIGIN: http://127.0.0.1:4173
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      AI_PROVIDER: mock
      LOG_LEVEL: error
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, boundaries, and types
        run: pnpm quality:ci

      - name: Prepare database
        run: pnpm db:migrate && pnpm ingest:records

      - name: Run unit, contract, and integration tests
        run: pnpm test

      # `if: always()` so an intentionally red test step above cannot hide these gates' findings:
      # both print a full report, and the job still fails overall.
      - name: Run golden-retrieval regression eval
        if: always()
        run: pnpm eval:deterministic

      # Brief-quality acceptance gate for the checked-in sample artifacts. The rules are unit
      # tested in tests/unit/brief-quality.test.ts; this step measures the deliverables themselves,
      # so it stays red until the grounding fix lands and samples/ is regenerated from it. The
      # live-LLM tier (pnpm eval:brief-quality:live) is deliberately not run here: it spends real
      # tokens and is opt-in behind BRIEF_QUALITY_LIVE=1.
      - name: Audit sample brief quality
        if: always()
        run: pnpm eval:brief-quality

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # A dedicated database, because the unit/integration step above writes evidence rows with no
      # embeddings into DATABASE_URL (record-ingestion.test.ts asserts ingestion never creates
      # them). The readiness probe requires every evidence row to carry one consistent embedding
      # profile, so those leftovers make it report the index unavailable, which correctly disables
      # Generate Brief - and then e2e fails on a gate that is doing its job. Playwright's own
      # webServer seeds and indexes this database from scratch via db:ensure.
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://slacato:slacato@127.0.0.1:54329/slacato_e2e

      # Every gate above reads the REPOSITORY; this one reads the BUILD CONTEXT, and the two are not
      # the same file set. A commit can pass everything else and still be undeployable - which is
      # exactly what happened when the web app started reading its documents from docs/ and samples/,
      # both excluded by .dockerignore. `if: always()` so an unrelated red step cannot hide it.
      - name: Build the web image and confirm it carries the documents it serves
        if: always()
        run: |
          set -euo pipefail
          docker build -f Dockerfile.web -t slacato-web-ci .
          docker run --rm --entrypoint sh slacato-web-ci -c 'cat /srv/technical-overview.html' \
            | diff -q - docs/technical-overview.html
          docker run --rm --entrypoint sh slacato-web-ci -c 'cat /srv/samples/slack-impact.html' \
            | diff -q - samples/slack-impact.html

